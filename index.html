<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- File CSS External -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Audio Element -->
    <audio id="bgMusic" loop preload="auto">
        <source src="love.mp3" type="audio/mpeg">
    </audio>

    <!-- Tombol Pemutar Musik (Kanan Atas) -->
    <button id="musicBtn" class="music-btn" onclick="toggleMusic()">
        <span class="music-icon">♫</span>
        <span id="musicText">Tap to Play Music ♫</span>
    </button>

    <!-- Background Bintang -->
    <div class="stars"></div>

    <!-- Container utama -->
    <div class="container">
        <p class="sub-header">✧ A LITTLE SOMETHING ✧</p>

        <h1 class="title">for you <span class="heart">♡</span></h1>

        <p class="tagline">made with love, from your love.</p>

        <!-- Gambar Beruang Mawar Tanpa Background -->
        <div class="image-wrapper">
            <div class="glow"></div>
            <img src="176455-removebg-preview.png" alt="Beruang Megang Mawar" class="bear-img">
        </div>

        <a href="#" class="btn-open">open the book ♡</a>

        <p class="footer-note">✧ A TINY BOOK FULL OF LOVE ✧</p>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const musicText = document.getElementById('musicText');

        function toggleMusic() {
            if (music.paused) {
                music.play().then(() => {
                    musicText.textContent = 'Music Playing ♪';
                    musicBtn.classList.add('playing');
                }).catch(err => {
                    console.log("Audio play error: ", err);
                });
            } else {
                music.pause();
                musicText.textContent = 'Music Paused ♫';
                musicBtn.classList.remove('playing');
            }
        }

        // Putar lagu otomatis begitu layar disentuh/diketuk pertama kali
        document.body.addEventListener('click', function() {
            if (music.paused) {
                music.play().then(() => {
                    musicText.textContent = 'Music Playing ♪';
                    musicBtn.classList.add('playing');
                }).catch(() => {});
            }
        }, { once: true });
    </script>
</body>
</html>
